- insert:
    - id: admin-gateway
      name: dsh-admin-gateway
      config:
        port: 3081
        upstream: 'http://127.0.0.1:3080'
        # 管理员密码：优先取环境变量 DSH_ADMIN_PASSWORD，未设置时用此值
        # adminPassword: 'change-me'
        # 本地部署真实域名；发布到 npm 前改回 dsh.example.com（脱敏红线）
        allowedHosts:
          - dsh.example.com
        sessionTtlMs: 43200000
        maxBodyBytes: 5242880
